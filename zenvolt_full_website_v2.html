<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenVolt — Powering Smart Living</title>
  <style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

/* ── THEME VARIABLES ── */
body.dark{
  --bg:#070707;--surface:#111111;--surface2:#161616;--surface3:#1c1c1c;
  --gold:#C9A96E;--gold-l:#E8C987;--gold-d:#8a6b3e;
  --accent:#7DF9FF;--accent2:#ff6ec7;
  --text:#FFFFFF;--text2:#BDBDBD;--text3:rgba(189,189,189,0.5);
  --border:rgba(201,169,110,0.15);--border2:rgba(201,169,110,0.3);
  --glass:rgba(17,17,17,0.75);
  --primary:var(--gold);--primary-l:var(--gold-l);
  --btn-text:#000;
  --ticker-bg:#111111;--ticker-text:#C9A96E;
  --nav-bg:rgba(7,7,7,0.92);
  --card-hover:rgba(201,169,110,0.06);
  --inp-bg:#0d0d0d;
  --admin-sidebar:#0d0d0d;
  --admin-header:#111111;
}
body.light{
  --bg:#FFF5F8;--surface:#FFFFFF;--surface2:#FFF0F5;--surface3:#FFE6EF;
  --gold:#D4537E;--gold-l:#E8799A;--gold-d:#993556;
  --accent:#D4537E;--accent2:#534AB7;
  --text:#1a0a14;--text2:#72243E;--text3:rgba(153,53,86,0.5);
  --border:rgba(212,83,126,0.2);--border2:rgba(212,83,126,0.4);
  --glass:rgba(255,255,255,0.8);
  --primary:var(--gold);--primary-l:var(--gold-l);
  --btn-text:#fff;
  --ticker-bg:#FFE6EF;--ticker-text:#993556;
  --nav-bg:rgba(255,245,248,0.95);
  --card-hover:rgba(212,83,126,0.05);
  --inp-bg:#FFF5F8;
  --admin-sidebar:#fff0f5;
  --admin-header:#FFFFFF;
}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-x:hidden;transition:background .4s,color .4s}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--surface)}
::-webkit-scrollbar-thumb{background:var(--primary);border-radius:2px}

/* ── TICKER ── */
.ticker-wrap{background:var(--ticker-bg);border-bottom:1px solid var(--border);overflow:hidden;height:36px;display:flex;align-items:center}
.ticker-label{padding:0 16px;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--primary);white-space:nowrap;border-right:1px solid var(--border);height:100%;display:flex;align-item[...]
.ticker-track{display:flex;animation:ticker 28s linear infinite;white-space:nowrap}
.ticker-track:hover{animation-play-state:paused}
.ticker-item{padding:0 40px;font-size:12px;color:var(--ticker-text);letter-spacing:1.5px;display:flex;align-items:center;gap:12px}
.ticker-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:pulse2 2s infinite}
@keyframes pulse2{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.6)}}
@keyframes ticker{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}

/* ── NAV ── */
nav{background:var(--nav-bg);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;position:stic[...]
.nav-logo-row{display:flex;align-items:center;gap:12px}
.nav-zv{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--primary-l));display:flex;align-items:center;justify-content:center;font-family:'Space Grotes[...]
.nav-brand{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--primary-l));-webkit-background-clip:text;-webkit-text-fill-c[...]
.nav-links{display:flex;gap:0;list-style:none}
.nav-links li a{color:var(--text2);text-decoration:none;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;padding:8px 16px;border-radius:6px;transition:.25s;display:block}
.nav-links li a:hover,.nav-links li a.active{color:var(--primary);background:var(--card-hover)}
.nav-right{display:flex;align-items:center;gap:12px}

/* THEME TOGGLE */
.theme-toggle{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:50px;padding:4px 12px;cursor:pointer;transition:.3s;user-select:none}
.theme-toggle:hover{border-color:var(--border2)}
.toggle-track{width:40px;height:22px;border-radius:11px;background:var(--border);position:relative;transition:.35s;flex-shrink:0}
body.dark .toggle-track{background:linear-gradient(135deg,#C9A96E,#8a6b3e)}
body.light .toggle-track{background:linear-gradient(135deg,#D4537E,#F4C0D1)}
.toggle-thumb{width:16px;height:16px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:.35s;display:flex;align-items:center;justify-content:center;font-size:10px}
body.light .toggle-thumb{transform:translateX(18px)}
.toggle-label{font-size:11px;letter-spacing:1px;color:var(--text2);white-space:nowrap}

.nav-cart-btn{background:linear-gradient(135deg,var(--primary),var(--primary-l));color:var(--btn-text);border:none;padding:8px 20px;border-radius:6px;font-family:'Space Grotesk',sans-serif;font-si[...]
.nav-cart-btn:hover{transform:translateY(-1px);filter:brightness(1.1)}
.cart-badge{background:var(--accent);color:#000;border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}

/* ── PAGE SYSTEM ── */
.page{display:none}.page.active{display:block}

/* ── HERO ── */
#hero-section{min-height:calc(100vh - 100px);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-inner{position:relative;z-index:5;text-align:center;padding:0 20px;animation:heroIn 1.2s ease both}
@keyframes heroIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.hero-pill{display:inline-flex;align-items:center;gap:8px;background:rgba(201,169,110,0.08);border:1px solid var(--border2);padding:8px 20px;border-radius:50px;margin-bottom:32px;font-size:11px;co[...]
body.light .hero-pill{background:rgba(212,83,126,0.08)}
.hero-pill-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse2 2s infinite}
.hero-h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(48px,7vw,88px);font-weight:700;line-height:1.05;letter-spacing:-2px;margin-bottom:12px}
.hero-h1 em{font-style:normal;background:linear-gradient(135deg,var(--primary),var(--primary-l),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:shimmer 4[...]
@keyframes shimmer{0%,100%{filter:hue-rotate(0deg)}50%{filter:hue-rotate(15deg)}}
.hero-sub{font-size:18px;font-weight:300;color:var(--text2);margin-bottom:12px;letter-spacing:.5px}
.hero-p{font-size:15px;color:var(--text3);max-width:480px;margin:0 auto 48px;line-height:1.7}
.hero-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.btn-gold{background:linear-gradient(135deg,var(--primary),var(--primary-l));color:var(--btn-text);padding:15px 34px;border:none;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size[...]
.btn-gold::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,0);transition:.3s}
.btn-gold:hover::after{background:rgba(255,255,255,0.12)}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(201,169,110,0.35)}
body.light .btn-gold:hover{box-shadow:0 12px 36px rgba(212,83,126,0.3)}
.btn-ghost{background:transparent;color:var(--text);padding:15px 34px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:5[...]
body.light .btn-ghost{border-color:var(--border2);color:var(--text)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.hero-scroll-hint{position:absolute;bottom:32px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;animation:bob 2.5s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-8px)}}
.scroll-line{width:1px;height:36px;background:linear-gradient(to bottom,var(--primary),transparent)}
.scroll-txt{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3)}

/* ── STATS ── */
.stats-strip{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.stat-cell{padding:28px 20px;text-align:center;border-right:1px solid var(--border);position:relative;overflow:hidden;transition:.3s}
.stat-cell:last-child{border-right:none}
.stat-cell:hover{background:var(--card-hover)}
.stat-cell::before{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:linear-gradient(90deg,var(--primary),var(--primary-l));transition:.4s}
.stat-cell:hover::before{width:100%}
.stat-n{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--primary-l));-webkit-background-clip:text;-webkit-text-fill-col[...]
@keyframes countUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stat-l{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--text3);margin-top:4px}

/* ── SECTION STYLES ── */
.section{padding:100px 40px}
.sec-tag{font-size:10px;letter-spacing:4px;text-transform:uppercase;color:var(--primary);margin-bottom:14px}
.sec-h{font-family:'Space Grotesk',sans-serif;font-size:clamp(28px,4vw,48px);font-weight:700;line-height:1.1;letter-spacing:-1px;margin-bottom:16px}
.sec-h em{font-style:normal;background:linear-gradient(135deg,var(--primary),var(--primary-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sec-p{font-size:15px;color:var(--text2);line-height:1.75;max-width:560px}
.tc{text-align:center}.tc .sec-p{margin:0 auto}

/* ── PRODUCT GRID ── */
.prod-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.prod-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.4s cubic-bezier(.25,.8,.25,1);position:relative}
.prod-card:hover{transform:translateY(-10px) scale(1.01);border-color:var(--border2);box-shadow:0 28px 60px rgba(0,0,0,.5)}
body.light .prod-card:hover{box-shadow:0 20px 50px rgba(212,83,126,.15)}
.prod-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,var(--primary),transparent);opacity:0;transition:.4s;border-radius:16px;pointer-events:none}
.prod-card:hover::before{opacity:.04}
.pcard-visual{height:200px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.pcard-icon{font-size:56px;transition:.5s;z-index:2;position:relative}
.prod-card:hover .pcard-icon{transform:scale(1.15) rotate(5deg)}
.pcard-glow{position:absolute;inset:0;opacity:0;transition:.4s}
.prod-card:hover .pcard-glow{opacity:1}
.pcard-badge{position:absolute;top:14px;right:14px;background:rgba(125,249,255,.12);border:1px solid rgba(125,249,255,.3);color:var(--accent);font-size:9px;letter-spacing:2px;text-transform:upper[...]
body.light .pcard-badge{background:rgba(83,74,183,.1);border-color:rgba(83,74,183,.3);color:var(--accent2)}
.pcard-body{padding:22px}
.pcard-cat{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--primary);margin-bottom:6px}
.pcard-name{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;margin-bottom:8px;color:var(--text)}
.pcard-desc{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:18px}
.pcard-stars{display:flex;align-items:center;gap:3px;margin-bottom:14px;font-size:13px;color:var(--primary)}
.pcard-footer{display:flex;align-items:center;justify-content:space-between}
.pcard-price{font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:var(--primary)}
.pcard-btns{display:flex;gap:8px}
.pbtn-sm{padding:8px 16px;border-radius:6px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:.3s;border:1px solid var(--border2);background:t[...]
.pbtn-sm:hover{background:var(--primary);color:var(--btn-text)}
.pbtn-sm.solid{background:linear-gradient(135deg,var(--primary),var(--primary-l));color:var(--btn-text);border-color:transparent}
.pbtn-sm.solid:hover{filter:brightness(1.1);transform:scale(1.04)}

/* ── ECOSYSTEM ── */
.eco-wrap{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.eco-canvas-box{height:460px;position:relative}
#eco-canvas{width:100%;height:100%}
.eco-feats{display:flex;flex-direction:column;gap:16px;margin-top:36px}
.eco-feat{display:flex;gap:14px;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:.3s}
.eco-feat:hover{border-color:var(--border2);background:var(--surface2);transform:translateX(6px)}
.eco-feat-ic{width:42px;height:42px;border-radius:10px;background:var(--card-hover);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrin[...]
.eco-feat-t{font-family:'Space Grotesk',sans-serif;font-size:14px;font-weight:600;margin-bottom:3px;color:var(--text)}
.eco-feat-s{font-size:12px;color:var(--text2);line-height:1.5}

/* ── LIFESTYLE GRID ── */
.life-grid{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:18px;height:560px}
.life-card{border-radius:16px;overflow:hidden;position:relative;cursor:pointer;border:1px solid var(--border);transition:.4s}
.life-card:hover{border-color:var(--border2);transform:scale(1.02)}
.life-card.big{grid-row:1/3}
.life-emoji{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;transition:.4s}
.life-card:hover .life-emoji{transform:scale(1.1)}
.life-over{position:absolute;inset:0;background:linear-gradient(to top,rgba(7,7,7,.88) 0%,transparent 60%)}
body.light .life-over{background:linear-gradient(to top,rgba(255,245,248,.88) 0%,transparent 60%)}
.life-txt{position:absolute;bottom:20px;left:20px;right:20px}
.life-tag{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
body.light .life-tag{color:var(--accent2)}
.life-title{font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:600;color:var(--text)}
.life-title.sm{font-size:14px}

/* ── FLAGSHIP ── */
.flag-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}
.flag-canvas-box{height:520px}
#desk-canvas{width:100%;height:100%}
.desk-feats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:32px}
.dfeat{background:var(--surface);border:1px solid var(--border);padding:18px;border-radius:12px;transition:.3s;cursor:default}
.dfeat:hover{border-color:var(--border2);background:var(--surface2)}
.dfeat-ic{font-size:22px;margin-bottom:10px}
.dfeat-n{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.dfeat-d{font-size:11px;color:var(--text2)}
.flag-price{display:flex;align-items:baseline;gap:10px;margin:28px 0 22px}
.flag-amt{font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--primary-l));-webkit-background-clip:text;-webkit-text-fill-c[...]
.flag-lbl{font-size:13px;color:var(--text3)}

/* ── NEWSLETTER ── */
.nl-section{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:90px 40px;text-align:center}
.nl-form{display:flex;gap:10px;max-width:520px;margin:36px auto 0}
.nl-inp{flex:1;background:var(--inp-bg);border:1px solid var(--border);border-radius:8px;padding:14px 18px;color:var(--text);font-size:14px;outline:none;transition:.3s}
.nl-inp::placeholder{color:var(--text3)}
.nl-inp:focus{border-color:var(--border2)}
.nl-btn{background:linear-gradient(135deg,var(--primary),var(--primary-l));color:var(--btn-text);border:none;padding:14px 24px;border-radius:8px;font-family:'Space Grotesk',sans-serif;font-size:1[...]
.nl-btn:hover{transform:translateY(-2px);filter:brightness(1.08)}

/* ── ABOUT ── */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start}
.timeline{padding-left:28px;position:relative;margin-top:36px}
.timeline::before{content:'';position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:linear-gradient(to bottom,var(--primary),transparent)}
.tl{margin-bottom:28px;position:relative}
.tl-dot{position:absolute;left:-25px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary);box-shadow:0 0 10px var(--primary)}
.tl-yr{font-size:10px;letter-spacing:2px;color:var(--primary);margin-bottom:3px}
.tl-t{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--text);margin-bottom:3px}
.tl-d{font-size:12px;color:var(--text2);line-height:1.5}
.val-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:32px}
.val-card{padding:22px;background:var(--surface);border:1px solid var(--border);border-radius:12px;transition:.3s}
.val-card:hover{border-color:var(--border2);transform:translateY(-3px)}
.val-ic{font-size:26px;margin-bottom:10px}
.val-n{font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;color:var(--primary);margin-bottom:4px}
.val-d{font-size:12px;color:var(--text2);line-height:1.5}

/* ── LOOKBOOK ── */
.lb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:52px}
.lb-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;cursor:pointer;transition:.4s}
.lb-card:hover{transform:translateY(-6px);border-color:var(--border2)}
.lb-visual{height:160px;display:flex;align-items:center;justify-content:center;font-size:54px}
.lb-body{padding:22px}
.lb-cat{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
body.light .lb-cat{color:var(--accent2)}
.lb-t{font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.4}
.lb-p{font-size:12px;color:var(--text2);line-height:1.6}
.lb-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-top:14px}

/* ── CONTACT ── */
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:72px}
.ct-detail{display:flex;gap:14px;align-items:flex-start;padding:18px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;transition:.3s}
.ct-detail:hover{border-color:var(--border2)}
.ct-ic{width:42px;height:42px;border-radius:10px;background:var(--card-hover);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.ct-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--primary);margin-bottom:3px}
.ct-val{font-size:13px;color:var(--text)}
.ct-form-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px}
.form-g{margin-bottom:18px}
.form-lbl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);display:block;margin-bottom:7px}
.form-inp,.form-ta,.form-sel{width:100%;background:var(--inp-bg);border:1px solid var(--border);border-radius:8px;padding:13px 15px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px[...]
.form-inp::placeholder,.form-ta::placeholder{color:var(--text3)}
.form-inp:focus,.form-ta:focus,.form-sel:focus{border-color:var(--border2);box-shadow:0 0 0 3px rgba(201,169,110,.07)}
body.light .form-inp:focus,body.light .form-ta:focus{box-shadow:0 0 0 3px rgba(212,83,126,.07)}
.form-ta{min-height:110px;resize:vertical}
.form-2col{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.socials{display:flex;gap:10px;margin-top:28px}
.soc-btn{width:42px;height:42px;border-radius:10px;background:var(--surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;tr[...]
.soc-btn:hover{border-color:var(--primary);background:var(--card-hover)}

/* ── CART ── */
.cart-layout{display:grid;grid-template-columns:1fr 340px;gap:36px;padding:80px 40px;padding-top:40px}
.cart-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px}
.ci{display:flex;align-items:center;gap:18px;padding:18px 0;border-bottom:1px solid var(--border)}
